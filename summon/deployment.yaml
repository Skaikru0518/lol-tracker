apiVersion: v1
kind: Secret
metadata:
  name: summon-secret
  namespace: vandslab
type: Opaque
data:
  # base64 of: Host=...;Port=5432;Database=...;Username=...;Password=...;Search Path=dotnet
  connection_string:
  riot_api_key:
---
apiVersion: v1
kind: Service
metadata:
  name: summon-service
  namespace: vandslab
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/session.cookie.name: "smmn"
    traefik.ingress.kubernetes.io/session-cookie-samesite: "Strict"
spec:
  selector:
    app: summon
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: summon-cert
  namespace: vandslab
spec:
  secretName: summon-ssl
  dnsNames:
    - "summon.vandslab.com"
  duration: 168h
  renewBefore: 24h
  issuerRef:
    group: cert-manager.k8s.cloudflare.com
    kind: OriginIssuer
    name: prod-issuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: summon-ingress
  namespace: vandslab
  annotations:
    cert-manager.io/issuer: prod-issuer
    cert-manager.io/issuer-kind: OriginIssuer
    cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`summon.vandslab.com`)"
      kind: Rule
      services:
        - name: summon-service
          port: 80
  tls:
    secretName: summon-ssl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summon
  namespace: vandslab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: summon
  template:
    metadata:
      labels:
        app: summon
    spec:
      hostname: summon
      securityContext:
        runAsNonRoot: true
      containers:
      - name: summon
        image: registry.vandslab.hu/vandslab/summon-dotnet:placeholder
        imagePullPolicy: "Always"
        ports:
        - containerPort: 3000
        securityContext:
          runAsUser: 84977
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add: ['CHOWN', 'SETGID', 'SETUID', 'NET_BIND_SERVICE']
        startupProbe:
          tcpSocket:
            port: 3000
          failureThreshold: 6
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
          - name: ConnectionStrings__Summon
            valueFrom:
              secretKeyRef:
                name: summon-secret
                key: connection_string
          - name: Riot__ApiKey
            valueFrom:
              secretKeyRef:
                name: summon-secret
                key: riot_api_key

      imagePullSecrets:
      - name: reg-vandslab
